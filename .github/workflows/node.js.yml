name: CI

on:
  push:
    branches: [main, pre-main, routine]
  pull_request:
    branches: [main, pre-main, routine]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gym-tracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gym-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web export
        run: npx expo export --platform web
